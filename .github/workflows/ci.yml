# Manual verification pipeline — the local gate (`scripts/verify.ps1`), on a runner.
#
# `workflow_dispatch` is the *only* trigger, deliberately. CI was deferred on cost (`PLT-01` in
# docs/FEATURE_INDEX.md): hosted runner minutes are not free, and a push- or PR-triggered
# workflow spends them on every commit whether or not anyone wants an answer. Pressing "Run
# workflow" spends them once, when someone does. Do not add `push:`, `pull_request:` or
# `schedule:` here without deciding to pay for them — that decision is the whole reason this
# file took as long as it did to arrive.
#
# `ubuntu-latest` for the same reason: Windows runners bill at 2x and macOS at 10x the minute
# rate. Nothing in the two checks below is OS-specific — packaging is (`PLT-02`), and packaging
# is not what this verifies.
#
# This runs exactly what verify.ps1 runs, in the same order, and nothing else:
#   1. Every module test suite.
#   2. Every module's production and test sources with `-PwarningsAsErrors`.
name: CI

on:
  workflow_dispatch:
    inputs:
      render_tests:
        description: >-
          Render guards (PLT-08): they need a surface Skia can target, which a runner has no
          display for. "skip" reports them as skipped, never as passed; "xvfb" gives them a
          virtual display so they actually run.
        type: choice
        required: false
        default: skip
        options:
          - skip
          - xvfb

# A second manual run of the same ref makes the first one's result irrelevant; cancelling it
# stops paying for an answer nobody will read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests + zero-warning build
    runs-on: ubuntu-latest
    # The gate is two Gradle invocations on a cold cache; anything past this is a hang, and a
    # hung job bills for the full 6-hour default.
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # JDK 17 is the floor stated in CONTRIBUTING.md; the build is written against it, so the
      # runner should not silently verify on a newer one.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Caches ~/.gradle between runs and validates the wrapper JAR's checksum. Gradle 9.6.1
      # comes from gradle/wrapper/gradle-wrapper.properties — never a system Gradle.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Committed from Windows, so the executable bit may not have survived.
      - name: Make the wrapper executable
        run: chmod +x ./gradlew

      - name: Install Xvfb
        if: github.event.inputs.render_tests == 'xvfb'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # `RenderEnvironment` reads the platform's own `GraphicsEnvironment.isHeadless()`, which is
      # already true here with no `DISPLAY`; `-PskipRenderTests` states the same thing
      # explicitly, so the report says the guards were stood down on purpose rather than by
      # accident of environment.
      - name: Run all test suites
        if: github.event.inputs.render_tests != 'xvfb'
        run: ./gradlew :skaldoria-presentation:desktopTest :skaldoria-markdown:test :skaldoria-shared-ui:desktopTest :skaldoria-writer:desktopTest :skaldoria-canvas:desktopTest --no-daemon -PskipRenderTests

      - name: Run all test suites (with a virtual display)
        if: github.event.inputs.render_tests == 'xvfb'
        run: xvfb-run --auto-servernum ./gradlew :skaldoria-presentation:desktopTest :skaldoria-markdown:test :skaldoria-shared-ui:desktopTest :skaldoria-writer:desktopTest :skaldoria-canvas:desktopTest --no-daemon

      # Fix the cause, do not suppress it (CONTRIBUTING.md section 10).
      - name: Compile with warnings as errors
        run: ./gradlew :skaldoria-presentation:compileKotlinDesktop :skaldoria-presentation:compileTestKotlinDesktop :skaldoria-shared-ui:compileKotlinDesktop :skaldoria-shared-ui:compileTestKotlinDesktop :skaldoria-writer:compileKotlinDesktop :skaldoria-writer:compileTestKotlinDesktop :skaldoria-canvas:compileKotlinDesktop :skaldoria-canvas:compileTestKotlinDesktop -PwarningsAsErrors --no-daemon

      # Without this a red run says only "desktopTest FAILED"; the HTML/XML reports say which
      # case, and they are gone with the runner.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            skaldoria-presentation/build/reports/tests/
            skaldoria-presentation/build/test-results/
            skaldoria-markdown/build/reports/tests/
            skaldoria-markdown/build/test-results/
            skaldoria-shared-ui/build/reports/tests/
            skaldoria-shared-ui/build/test-results/
            skaldoria-writer/build/reports/tests/
            skaldoria-writer/build/test-results/
            skaldoria-canvas/build/reports/tests/
            skaldoria-canvas/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
