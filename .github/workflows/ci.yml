name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      # The render guards draw real Compose frames through ImageComposeScene. On a headless
      # Linux runner there is no display for Skia to target, so they need a virtual one;
      # Windows and macOS runners have a session already.
      - name: Install Xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Test
        if: runner.os != 'Linux'
        run: ./gradlew desktopTest --no-daemon

      - name: Test (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a ./gradlew desktopTest --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            build/reports/tests/desktopTest/
            build/test-results/desktopTest/

      # RENDERING_STATUS is explicit that a passing test is not evidence for rendering —
      # only looking at the image is. Publishing the PNGs is what makes that possible on CI.
      - name: Upload rendered slides
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-slides-${{ matrix.os }}
          path: |
            build/render-all/
            build/render-check/
          if-no-files-found: ignore

  warnings:
    name: Zero Kotlin warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3

      # Turns the zero-warning NFR from a wish into a gate. -Werror is passed here rather
      # than set in build.gradle.kts so a local build stays workable while iterating.
      - name: Compile with warnings as errors
        run: ./gradlew compileKotlinDesktop compileTestKotlinDesktop --no-daemon -PwarningsAsErrors
